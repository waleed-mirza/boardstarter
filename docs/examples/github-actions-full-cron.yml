# Copy this file to .github/workflows/cron.yml after configuring the matching
# Netlify and GitHub Actions secrets described in ../deployment.md.
name: Boardstarter automation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [expire-jobs, send-digest, renewal-nudges, keep-alive]
    env:
      SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check GitHub Actions configuration
        id: configuration
        run: |
          if [[ -z "${SITE_URL:-}" || -z "${CRON_SECRET:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Automation skipped::Add NEXT_PUBLIC_SITE_URL and CRON_SECRET as Actions secrets before enabling scheduled automation."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Run ${{ matrix.task }}
        if: steps.configuration.outputs.configured == 'true'
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/cron/${{ matrix.task }}"
